<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Piano Studio — play, read &amp; practice</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0b0e14;
      }
      .boot {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        color: #e8edf5;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .boot-logo {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        font-size: 46px;
        color: #e0b64c;
        background: linear-gradient(160deg, #2a3140, #171c26);
        border: 1px solid #26303f;
        box-shadow: 0 18px 60px rgba(224, 182, 76, 0.16);
      }
      .boot-title {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0.6px;
      }
      .boot-sub {
        font-size: 10px;
        letter-spacing: 2.4px;
        text-transform: uppercase;
        color: #8d99ad;
        margin-top: -10px;
      }
      .boot-bar {
        width: 168px;
        height: 3px;
        border-radius: 2px;
        background: #1b2230;
        overflow: hidden;
        margin-top: 6px;
      }
      .boot-bar span {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: 2px;
        background: #e0b64c;
        animation: boot-slide 1.15s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-logo" aria-hidden="true">♪</div>
        <div class="boot-title">Piano Studio</div>
        <div class="boot-sub">Play · Read · Practice</div>
        <div class="boot-bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
